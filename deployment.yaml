apiVersion: apps/v1
kind: Deployment
metadata:
  name: college-department-poojitha
spec:
  replicas: 3
  selector:
    matchLabels:
      app: college-department-poojitha
  template:
    metadata:
      labels:
        app: college-department-poojitha
    spec:
      containers:
        - name: college-department-poojitha
          image: kurellapoojitha/college-department:latest
          ports:
            - containerPort: 80

---
apiVersion: v1
kind: Service
metadata:
  name: college-department-service-poojitha
spec:
  type: NodePort
  selector:
    app: college-department-poojitha
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30019
